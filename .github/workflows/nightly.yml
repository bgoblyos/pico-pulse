name: Build and Publish Nightly Revisions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

# Grant write access to automatically manage releases and tags
permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If manually dispatched or pushed, always run
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Non-scheduled trigger. Proceeding with build."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get SHA of the latest commit tagged on the nightly release
          NIGHTLY_SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/nightly --jq .object.sha 2>/dev/null || echo "")
          CURRENT_SHA=$(git rev-parse HEAD)

          if [ "$NIGHTLY_SHA" = "$CURRENT_SHA" ]; then
            echo "No new commits since last nightly build. Skipping."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected. Proceeding with build."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
          
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board_rev: ['bare', 'integrated_v0.2', 'integrated_v0.2_hp']

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Checkout pico-sdk/develop
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: develop
          path: pico-sdk
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Build Firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2_w -DBOARD_REV=${{ matrix.board_rev }}
          cmake --build .
          
          # Rename the output file so it contains the board revision target
          mv *.uf2 pico-pulse-${{ matrix.board_rev }}.uf2

      - name: Upload Board Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board_rev }}
          path: build/pico-pulse-${{ matrix.board_rev }}.uf2

  publish-nightly:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all compiled binaries
        uses: actions/download-artifact@v8
        with:
          path: binaries
          merge-multiple: true

      - name: Publish Nightly Release Tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          body: "Automated firmware build compiled from commit ${{ github.sha }}."
          prerelease: true
          files: binaries/*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
